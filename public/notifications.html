<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Notifications & Alerts | DrexelHub</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/notifications.css">
</head>
<body>

  <div id="site-header"></div>
  <div id="site-nav"></div>

  <main class="main-content">
    <div class="container">

      <div class="card notifications-toolbar">
        <div>
          <h2 class="notifications-toolbar-title">Drexel Campus Notifications</h2>
          <p class="notifications-toolbar-desc">Stay updated on library hours, points earned, marketplace messages, and Drexel alerts.</p>
        </div>
        <button type="button" class="btn btn-primary" id="mark-all-read-btn">Mark All as Read</button>
      </div>

      <div id="notifications-list" class="notifications-list"></div>

    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/ui/layout.js"></script>
  <script src="/js/ui/header.js"></script>
  <script src="/js/ui/notifications.js"></script>
  <script src="/js/ui/auth.js"></script>
  <script src="/js/ui/modals.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
