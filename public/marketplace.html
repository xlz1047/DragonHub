<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Marketplace | DrexelHub</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/marketplace.css">
</head>
<body>

  <div id="site-header"></div>
  <div id="site-nav"></div>

  <main class="main-content">
    <div class="container">

      <div class="card marketplace-toolbar">
        <div>
          <h2 class="marketplace-toolbar-title">Drexel Student-to-Student Marketplace</h2>
          <p class="marketplace-toolbar-desc">Buy and sell textbooks, calculators, dorm gear & apparel safely on campus.</p>
        </div>
        <button type="button" class="btn btn-gold" data-open-modal="listing-modal">
          <span>➕</span> Post Listing (+20 Pts)
        </button>
      </div>

      <div class="category-filter">
        <button class="cat-btn active" data-category="All">All Items</button>
        <button class="cat-btn" data-category="Textbooks">📚 Textbooks</button>
        <button class="cat-btn" data-category="Electronics">💻 Electronics</button>
        <button class="cat-btn" data-category="Apparel">👕 Drexel Apparel</button>
        <button class="cat-btn" data-category="Dorm">🛏️ Dorm & Housing</button>
      </div>

      <div id="marketplace-grid" class="grid-3-col"></div>

    </div>
  </main>

  <div id="listing-modal" class="modal-backdrop hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="card-title"><span>🏷️</span> List Item on Marketplace</h3>
        <button type="button" class="modal-close" data-close-modal="listing-modal">✕</button>
      </div>
      <form id="listing-form">
        <div class="form-group">
          <label class="form-label">Item Title</label>
          <input type="text" id="item-title" class="form-input" placeholder="e.g. CS 260 Textbook (CLRS) 4th Edition" required>
        </div>
        <div class="form-row-2col">
          <div class="form-group">
            <label class="form-label">Price ($ USD)</label>
            <input type="number" id="item-price" class="form-input" placeholder="35" min="0" required>
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <select id="item-cat" class="form-select">
              <option value="Textbooks">Textbooks</option>
              <option value="Electronics">Electronics</option>
              <option value="Apparel">Drexel Apparel</option>
              <option value="Dorm">Dorm & Housing</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Condition</label>
          <select id="item-condition" class="form-select">
            <option value="Like New">Like New</option>
            <option value="Excellent">Excellent</option>
            <option value="Good">Good</option>
            <option value="Fair">Fair</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Preferred Meetup Location</label>
          <input type="text" id="item-location" class="form-input" placeholder="e.g. Hagerty Library Lobby or CCI Building">
        </div>
        <div class="form-group">
          <label class="form-label">Image URL</label>
          <input type="url" id="item-image" class="form-input" placeholder="https://images.unsplash.com/...">
        </div>
        <div class="form-actions-end">
          <button type="button" class="btn btn-outline modal-close" data-close-modal="listing-modal">Cancel</button>
          <button type="submit" class="btn btn-gold">Publish Listing (+20 Pts)</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/ui/layout.js"></script>
  <script src="/js/ui/header.js"></script>
  <script src="/js/ui/notifications.js"></script>
  <script src="/js/ui/auth.js"></script>
  <script src="/js/ui/modals.js"></script>
  <script src="/js/ui/marketplace.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
